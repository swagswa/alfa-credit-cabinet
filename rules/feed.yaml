version: 2026-10-23.1

# Лента клиента. На решение по заявке ничего отсюда не влияет.

# фраза клиенту на смену статуса заявки, {number} это номер заявки
events:
  submitted: {title: 'Заявка №{number} отправлена', text: 'Банк получил заявку и начинает проверку. Статус будет обновляться здесь'}
  checking: {title: 'Проверяем данные по заявке №{number}', text: 'Сверяем компанию с ЕГРЮЛ, налоговой и кредитной историей. От вас пока ничего не нужно'}
  need_info: {title: 'По заявке №{number} нужны уточнения', text: 'Откройте заявку: там написано, чего не хватает. Если не ответить в срок, заявка закроется'}
  scoring: {title: 'Заявка №{number} на оценке', text: 'Проверки пройдены, банк считает условия кредита'}
  approved: {title: 'Заявка №{number} одобрена', text: 'Условия в карточке заявки. Чтобы получить деньги, примите предложение и подпишите договор'}
  counter_offer: {title: 'По заявке №{number} другие условия', text: 'Банк готов выдать кредит, но не на тех условиях, что вы запросили. Новое предложение и причины в карточке заявки'}
  manual_review: {title: 'Заявку №{number} смотрит специалист', text: 'Нужна дополнительная проверка, это обычная процедура. Решение появится здесь'}
  rejected: {title: 'По заявке №{number} отказ', text: 'Причины в карточке заявки'}
  accepted: {title: 'Условия по заявке №{number} приняты', text: 'Осталось подписать договор в карточке заявки'}
  signing: {title: 'Договор по заявке №{number} на подписи', text: 'Подтвердите подпись кодом в карточке заявки'}
  issued: {title: 'Кредит по заявке №{number} выдан', text: 'Деньги зачислены на расчётный счёт компании'}
  closed: {title: 'Кредит по заявке №{number} закрыт', text: 'Договор закрыт, долга по нему нет'}
  cancelled_by_client: {title: 'Заявка №{number} отменена', text: 'Новую заявку можно подать в любой момент'}
  expired: {title: 'Заявка №{number} закрыта по сроку', text: 'Банк не дождался ответа на запрос. Подайте заявку заново, данные компании подставятся сами'}

# Подсказки по профилю компании, в порядке показа. Подсказка видна, если выполнены все условия when.
# input только такие:
#   okved_class         класс основного ОКВЭД, первые две цифры кода: eq, ne
#   products            продукты компании в банке (account, acquiring, salary): eq есть, ne нет
#   turnover_month_rub  средний приход на счёт в банке за 12 мес, руб: gt, lt
#   application         статус последней заявки компании, none если заявок нет: eq, ne
# products и turnover_month_rub берутся из последней проверки данных банка по заявкам компании.
# Пока проверки не было, условия по ним не выполняются.
tips:
  - code: first_application
    title: Подберите кредит под задачу
    text: 'Укажите цель, сумму и срок, кабинет подскажет подходящий продукт. Реквизиты компании подставятся из ЕГРЮЛ по ИНН'
    when:
      - {input: application, eq: none}

  - code: catering_overdraft
    title: Овердрафт под выручку по эквайрингу
    text: 'Оплата картами приходит на счёт каждый день, поэтому овердрафт гасится сам из поступлений. Удобно, чтобы закупить продукты до выручки'
    when:
      - {input: okved_class, eq: '56'}
      - {input: products, eq: acquiring}

  - code: catering_support
    title: Господдержка для общепита
    text: 'Общепит может получить кредит с господдержкой малого бизнеса, например с гарантией Корпорации МСП, если не хватает залога. Подходит ли компания, банк проверит при рассмотрении заявки'
    when:
      - {input: okved_class, eq: '56'}

  - code: transport_equipment
    title: Кредит на грузовики и прицепы
    text: 'Кредит на оборудование подходит и для транспорта: машина остаётся в залоге до погашения, собственный взнос от 10% цены, срок до 60 месяцев'
    when:
      - {input: okved_class, eq: '49'}

  - code: transport_overdraft
    title: Если заказчики платят с отсрочкой
    text: 'Овердрафт закрывает разрыв до прихода оплаты за рейсы: каждый транш до 60 дней, гасится автоматически из поступлений на счёт'
    when:
      - {input: okved_class, eq: '49'}
      - {input: products, ne: overdraft}

  - code: no_account
    title: Счёт в банке ускорит проверку
    text: 'Когда обороты идут через наш счёт, выписка из другого банка не нужна. Без счёта к заявке понадобится выписка за 6-12 месяцев'
    when:
      - {input: products, ne: account}

  # порог подобран на синтетике, на проде пересчитать от минимальной суммы продуктов
  - code: low_turnover
    title: Основные платежи идут в другом банке?
    text: 'Оборотов по счёту у нас пока немного. Если выручка приходит в другой банк, приложите к заявке выписку оттуда: так банк увидит реальные обороты компании'
    when:
      - {input: products, eq: account}
      - {input: turnover_month_rub, lt: 300000}
