version: 2026-10-26.1

# Каждый сценарий независим. Историю просрочек и отрасль не предлагаем исправлять.
improvements:
  - input: tax_arrears_rub
    target: 0
    title: Погасить налоговую задолженность
    detail: Расчёт для отсутствия недоимки, пеней и штрафов после обновления данных ФНС.
  - input: current_dsr
    target: 0.09
    title: Снизить платежи по текущим кредитам
    detail: Расчёт для платежей не выше 9% среднемесячной выручки. Снижение нагрузки нужно подтвердить актуальными данными.
  - input: revenue_trend
    target: 1
    title: Восстановить выручку
    detail: Расчёт для выручки последних шести месяцев на уровне предыдущих шести. Это сценарий на будущее.
  - input: turnover_cv
    target: 0.29
    title: Сделать поступления стабильнее
    detail: Расчёт для коэффициента колебаний оборотов 0,29 за 12 месяцев. Нужна подтверждённая история поступлений.
  - input: inquiries_90d
    target: 2
    title: Сократить число обращений за кредитами
    detail: Расчёт для двух запросов за 90 дней. Уже сделанные запросы не удаляются, нужно дождаться обновления периода.

# Консервативный ориентир по выручке, без кредитной истории и класса риска.
# Это отдельные допущения, не матрица одобрения.
revenue_multipliers:
  working_capital: 2
  overdraft: 0.5
  equipment: 3
