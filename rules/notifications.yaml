version: 2026-10-25.1

# Уведомления клиенту в кабинете (колокольчик). Пишутся в одной транзакции со сменой статуса.
# Нет фразы на статус, нет уведомления. Подстановки: {number} номер заявки,
# {amount} сумма из условий банка, {account} счёт выдачи (последние цифры), {code} код подписи.
statuses:
  need_info: {title: 'Банку нужны уточнения по заявке №{number}', text: 'Откройте заявку: там написано, чего не хватает. Если не ответить в срок, заявка закроется'}
  approved: {title: 'Банк одобрил заявку №{number}', text: 'Кредит {amount}. Примите условия в карточке заявки, предложение действует ограниченное время'}
  counter_offer: {title: 'Банк предложил другие условия по заявке №{number}', text: 'Банк готов выдать {amount}. Сравните предложение с запросом в карточке заявки'}
  rejected: {title: 'По заявке №{number} отказ', text: 'Причины и что можно сделать, в карточке заявки'}
  signing: {title: 'Договор по заявке №{number} готов', text: 'Проверьте договор и подпишите его кодом в карточке заявки'}
  issued: {title: 'Кредит выдан', text: '{amount} зачислены на счёт {account}'}
  expired: {title: 'Заявка №{number} закрыта по сроку', text: 'Вовремя не пришёл ответ банку, согласие с условиями или подпись. Подайте заявку заново'}

# аналог push в приложении банка: SMS в сценарии нет
signing_code: {title: 'Код подписания', text: 'Код {code} для подписания договора по заявке №{number}. Никому не сообщайте его, сотрудники банка код не спрашивают'}
