version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-same-issues: 50

formatters:
  enable:
    - gofmt
    - goimports
    - golines
  settings:
    goimports:
      local-prefixes:
        - github.com/swagswa/alfa-credit-cabinet
    golines:
      max-len: 120

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - unused
    - unparam
    - unconvert
    - wastedassign
    - errorlint
    - nilerr
    - nilnesserr
    - wrapcheck
    - gosec
    - bidichk
    - asciicheck
    - gocritic
    - goconst
    - dupl
    - reassign
    - cyclop
    - gocognit
    - funlen
    - nestif
    - copyloopvar
    - intrange
    - modernize
    - exptostd
    - bodyclose
    - noctx
    - sqlclosecheck
    - rowserrcheck
    - mnd
    - errname
    - nakedret
    - durationcheck
    - exhaustive
    - makezero
    - mirror
    - musttag
    - nolintlint
    - perfsprint
    - usestdlibvars
    - usetesting
    - depguard

  settings:
    cyclop:
      max-complexity: 20
      package-average: 8.0
    errcheck:
      check-type-assertions: true
    funlen:
      lines: 80
      statements: 50
    gocognit:
      min-complexity: 15
    gocritic:
      enabled-tags: [diagnostic, style, performance, opinionated]
      disabled-checks:
        # хендлеры strict server получают запросы по значению, так их генерирует oapi-codegen
        - hugeParam
    govet:
      enable-all: true
      disable:
        - fieldalignment
    mnd:
      ignored-functions:
        - time.Duration
    nakedret:
      max-func-lines: 0
    nestif:
      min-complexity: 4
    nolintlint:
      require-explanation: true
      require-specific: true
    wrapcheck:
      extra-ignore-sigs:
        - .JSON(
        - .NoContent(
        - .Blob(
        - .WithTx(
        - (github.com/jackc/pgx/v5.Tx).Commit(
      ignore-sig-regexps:
        - '\.New.*Error\('
      # свои пакеты подписывают ошибки там, где они возникли; второй слой
      # обёрток над repo и usecase только удлиняет текст ошибки
      ignore-package-globs:
        - github.com/swagswa/alfa-credit-cabinet/*
    staticcheck:
      checks: [all, -ST1000, -ST1016, -QF1008]
    depguard:
      rules:
        deprecated:
          deny:
            - pkg: io/ioutil
              desc: устарел, есть io и os
            - pkg: github.com/satori/go.uuid
              desc: берём github.com/google/uuid
        non-test:
          files: ["!$test"]
          deny:
            - pkg: math/rand$
              desc: math/rand/v2 или crypto/rand

  exclusions:
    generated: strict
    warn-unused: true
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      - path: '_test\.go'
        linters: [bodyclose, dupl, errcheck, funlen, goconst, gosec, noctx, wrapcheck, gocognit, mnd]
      # синтетика: числа тут и есть данные (суммы, доли, координаты вёрстки),
      # а math/rand/v2 с seed от ИНН нужен ради воспроизводимости
      - path: 'internal/(mocks|docgen)/'
        linters: [mnd]
      - path: 'internal/(mocks|docgen)/'
        text: G404
        linters: [gosec]
