name: credit-cabinet

x-backend-env: &backend-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://${POSTGRES_USER:-credit}:${POSTGRES_PASSWORD:-credit}@db:5432/credit?sslmode=disable
  # passthrough: без него grpc резолвит имя сам и шлёт SRV/TXT запросы, а в Docker Desktop
  # они уходят на DNS хоста и висят по 5 с, клиент отваливается по таймауту до подключения
  TEMPORAL_HOSTPORT: passthrough:///temporal:7233
  # трейсы в Jaeger, только в профиле obs: make up-obs задаёт адрес, без него не пишутся
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}

x-temporal-db-env: &temporal-db-env
  DB: postgres12
  DB_PORT: 5432
  POSTGRES_SEEDS: db
  POSTGRES_USER: ${POSTGRES_USER:-credit}
  POSTGRES_PWD: ${POSTGRES_PASSWORD:-credit}

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: credit
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
    volumes:
      - db:/var/lib/postgresql
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      # по TCP, а не по сокету: во время init-скриптов временный сервер слушает только сокет
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d credit"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.6.0-alpine
    # AOF: рестарт стенда не должен разлогинивать всех
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  temporal-setup:
    image: temporalio/admin-tools:1.32.1
    environment:
      <<: *temporal-db-env
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        tool="temporal-sql-tool --plugin postgres12 --ep db -p 5432 -u $$POSTGRES_USER --pw $$POSTGRES_PWD"
        schema=/etc/temporal/schema/postgresql/v12
        $$tool --db temporal setup-schema -v 0.0
        $$tool --db temporal update-schema -d $$schema/temporal/versioned
        $$tool --db temporal_visibility setup-schema -v 0.0
        $$tool --db temporal_visibility update-schema -d $$schema/visibility/versioned
    depends_on:
      db:
        condition: service_healthy

  temporal:
    restart: unless-stopped
    image: temporalio/server:1.32.1
    environment:
      <<: *temporal-db-env
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
      PROMETHEUS_ENDPOINT: 0.0.0.0:9090
    volumes:
      - ./docker/temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro
    ports:
      - "127.0.0.1:7233:7233"
    depends_on:
      temporal-setup:
        condition: service_completed_successfully

  temporal-namespace:
    image: temporalio/admin-tools:1.32.1
    environment:
      TEMPORAL_ADDRESS: passthrough:///temporal:7233
    entrypoint: ["sh", "-c"]
    # сервер принимает соединения не сразу после старта контейнера, ждём его здесь
    command:
      - |
        n=0
        until temporal operator cluster health >/dev/null 2>&1; do
          n=$$((n + 1))
          [ "$$n" -ge 60 ] && { echo "temporal не поднялся за 60 с" >&2; exit 1; }
          sleep 1
        done
        temporal operator namespace describe -n default >/dev/null 2>&1 \
          || temporal operator namespace create -n default --retention 72h
    depends_on:
      - temporal

  temporal-ui:
    restart: unless-stopped
    image: temporalio/ui:2.56.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "127.0.0.1:8233:8080"
    depends_on:
      - temporal

  api:
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    build:
      context: .
      target: app
    command: ["/app/api"]
    environment:
      <<: *backend-env
      HTTP_ADDR: :8080
      # демо-значение, чтобы стенд поднимался одной командой; вне демо задать свой в .env
      JWT_SECRET: ${JWT_SECRET:-demo-only-jwt-secret-replace-outside-demo}
      AI_ENABLED: ${AI_ENABLED:-false}
      SEED_DEMO: ${SEED_DEMO:-true}
      REDIS_ADDR: redis:6379
      # стенд по http: с Secure браузер cookie не сохранит; за https включить
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOGIN_ATTEMPTS: ${LOGIN_ATTEMPTS:-10}
      LOGIN_WINDOW: ${LOGIN_WINDOW:-1m}
      SIGNING_CODE_TTL: ${SIGNING_CODE_TTL:-5m}
      EGRUL_URL: http://mocks:8081
      BANK_URL: http://mocks:8081
      MOCKS_URL: http://mocks:8081
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "/app/api", "-healthcheck", "http://localhost:8080/api/health"]
      interval: 5s
      timeout: 4s
      retries: 20
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully

  worker:
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped
    build:
      context: .
      target: app
    command: ["/app/worker"]
    environment:
      <<: *backend-env
      EGRUL_URL: http://mocks:8081
      FNS_URL: http://mocks:8081
      BKI_URL: http://mocks:8081
      BANK_URL: http://mocks:8081
      # сроки демо; на проде 5, 1 и 10 рабочих дней
      NEED_INFO_TTL: ${NEED_INFO_TTL:-10m}
      REVIEW_SLA: ${REVIEW_SLA:-5m}
      OFFER_TTL: ${OFFER_TTL:-5m}
      SIGNING_TTL: ${SIGNING_TTL:-5m}
      CLOSE_AFTER: ${CLOSE_AFTER:-1m}
    depends_on:
      api:
        condition: service_healthy

  docs-worker:
    deploy:
      resources:
        limits:
          memory: 1g
    restart: unless-stopped
    profiles: [ai]
    build:
      context: .
      target: docs-worker
    environment:
      <<: *backend-env
      # воркер есть только в профиле ai, значит распознавание включено
      AI_ENABLED: "true"
      OLLAMA_URL: http://ollama:11434
    depends_on:
      api:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully

  mocks:
    restart: unless-stopped
    build:
      context: .
      target: app
    command: ["/app/mocks"]
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-}
      HTTP_ADDR: :8081
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "/app/mocks", "-healthcheck", "http://localhost:8081/health"]
      interval: 5s
      timeout: 4s
      retries: 20

  web:
    restart: unless-stopped
    build: ./web
    ports:
      - "${WEB_PORT:-8000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20
    depends_on:
      api:
        condition: service_healthy

  swagger:
    image: swaggerapi/swagger-ui:v5.34.0
    environment:
      SWAGGER_JSON: /spec/openapi.yaml
      # открывается через web на /swagger/, отдельного порта нет
      BASE_URL: /swagger
    volumes:
      - ./api/openapi.yaml:/spec/openapi.yaml:ro

  ollama:
    deploy:
      resources:
        limits:
          memory: 6g
    restart: unless-stopped
    profiles: [ai]
    image: ollama/ollama:0.40.7
    volumes:
      - ollama:/root/.ollama

  ollama-pull:
    profiles: [ai]
    image: ollama/ollama:0.40.7
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c"]
    command:
      - until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull qwen3:4b-instruct-2507-q4_K_M
    depends_on:
      - ollama

  # наблюдаемость, профиль obs: make up-obs. Основной сценарий от неё не зависит
  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.7.2
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    ports:
      - "9090:9090"

  loki:
    profiles: [obs]
    image: grafana/loki:3.5.7
    volumes:
      - loki:/loki

  # собирает логи контейнеров через сокет docker, только чтение
  alloy:
    profiles: [obs]
    image: grafana/alloy:v1.11.3
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  jaeger:
    profiles: [obs]
    image: jaegertracing/jaeger:2.11.0
    ports:
      - "16686:16686"

  grafana:
    profiles: [obs]
    image: grafana/grafana:12.2.1
    environment:
      # стенд для проверки: смотреть можно без входа, править под admin/admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/credit.json
      POSTGRES_USER: ${POSTGRES_USER:-credit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-credit}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - jaeger

volumes:
  db:
  redis:
  ollama:
  prometheus:
  loki:
