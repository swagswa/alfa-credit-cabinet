package: oapi
output: api.gen.go
generate:
  models: true
  echo-server: true
  strict-server: true
  embedded-spec: true
  # клиент нужен только e2e, в бинарники api не попадает: линкер выкидывает неиспользуемое
  client: true
output-options:
  # SSE живёт обычным хендлером echo, strict server стримить не умеет;
  # примеры документов отдаёт mocks, в api их нет
  exclude-operation-ids:
    - streamEvents
    - getSampleDocument
  # иначе вместе с операцией вырезается и схема StreamEvent, а она нужна хендлеру SSE
  skip-prune: true
compatibility:
  # без этого enum-константы разных схем (Approved, Other) сталкиваются в одном пакете
  always-prefix-enum-values: true
