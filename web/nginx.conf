server {
    listen 80;
    root /usr/share/nginx/html;

    # DNS докера: адрес api перечитывается, иначе после рестарта api nginx стучится
    # в старый IP контейнера и отдаёт 502
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;
    set $mocks http://mocks:8081;
    set $swagger http://swagger:8080;

    # «Взять пример выписки»: синтетические документы рисует mocks, api о них не знает
    location /api/samples/ {
        proxy_pass $mocks;
    }

    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Request-Id $request_id;
        # по нему api считает попытки входа с одного адреса. nginx здесь первый
        # на входе, поэтому заголовок от клиента не дописываем, а заменяем:
        # иначе лимит обходится подставным X-Forwarded-For
        proxy_set_header X-Forwarded-For $remote_addr;
        # SSE: без этого nginx копит события в буфере и отдаёт пачкой
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    # Swagger с того же адреса, что и кабинет: относительный /api из спеки и cookie
    # сессии работают в try it out без CORS
    location /swagger/ {
        proxy_pass $swagger;
    }

    location / {
        try_files $uri /index.html;
    }
}
