name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: сгенерированный код совпадает с контрактом и sql
        run: go generate ./... && git diff --exit-code
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
      - name: workflowcheck
        run: go tool workflowcheck ./internal/worker/...
      - name: тесты
        run: go test ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: типы совпадают с контрактом
        run: npm run gen:api && git diff --exit-code src/api/schema.gen.ts
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --profile ai build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: стенд
        run: docker compose up -d --build --wait
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - name: логи стенда
        if: failure()
        run: mkdir -p web/playwright-report && docker compose logs --no-color > web/playwright-report/compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7
      - name: гасим стенд
        if: always()
        run: docker compose down -v

  # сервер без браузера: сценарии приёмки через api, сроки укорочены
  api-e2e:
    runs-on: ubuntu-24.04
    env:
      # короткие сроки, чтобы сценарий истечения не ждал три минуты
      NEED_INFO_TTL: 20s
      CLOSE_AFTER: 10s
      LOGIN_ATTEMPTS: "100"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: docker compose up -d --build --wait
      - run: make e2e
      - name: логи стенда
        if: failure()
        run: docker compose logs --no-color api worker mocks
